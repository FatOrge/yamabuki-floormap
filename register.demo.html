<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <title>アカウント新規作成 - 新宿山吹校内フロアマップ</title>
    <style>
        body {
            background: #f8fafc;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px 0;
        }
        .card {
            background: white;
            padding: 35px 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            width: 100%;
            max-width: 420px;
            box-sizing: border-box;
        }
        h2 { margin-top: 0; color: #1e293b; font-size: 22px; text-align: center; margin-bottom: 20px; }
        .section-title { font-size: 13px; font-weight: bold; color: #4f46e5; margin: 20px 0 10px; border-bottom: 2px solid #e0e7ff; padding-bottom: 4px; }
        .input-group { margin-bottom: 14px; }
        label { display: block; font-size: 13px; font-weight: bold; color: #64748b; margin-bottom: 5px; }
        input, select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .radio-group { display: flex; gap: 20px; margin-top: 5px; }
        .radio-group label { font-weight: normal; cursor: pointer; }
        
        .btn-primary {
            width: 100%;
            padding: 12px;
            background: #0ea5e9;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            margin-top: 25px;
        }
        .btn-primary:hover { background: #0284c7; }
        
        .link-text { text-align: center; margin-top: 20px; font-size: 13px; }
        .link-text a { color: #4f46e5; text-decoration: none; }
        .link-text a:hover { text-decoration: underline; }
        
        #status { font-size: 13px; text-align: center; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>✨ 新規アカウント作成</h2>
        
        <form id="registerForm">
            <div class="section-title">🔑 アカウント情報</div>
            
            <div class="input-group">
                <label>ログインID（半角英数：例 rabbit）</label>
                <input type="text" id="userId" placeholder="半角英数で入力" autocapitalize="none" required>
            </div>

            <div class="input-group">
                <label>ユーザ名（ニックネーム）</label>
                <input type="text" id="nickname" placeholder="例：やまぶき太郎" required>
            </div>
            
            <div class="input-group">
                <label>パスワード（6文字以上）</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <div class="input-group">
                <label>パスワード（確認用）</label>
                <input type="password" id="passwordConfirm" placeholder="••••••••" required>
            </div>

            <div class="section-title">🏫 山吹生データ（生徒情報）</div>

            <div class="input-group">
                <label>学科</label>
                <div class="radio-group">
                    <label><input type="radio" name="course" value="普通科" checked> 普通科</label>
                    <label><input type="radio" name="course" value="情報科"> 情報科</label>
                </div>
            </div>

            <div class="input-group">
                <label>所属クラス（部）</label>
                <select id="classGroup">
                    <option value="F1">F1（普通科 1部）</option>
                    <option value="F2">F2（普通科 2部）</option>
                    <option value="F3">F3（普通科 3部）</option>
                    <option value="F4">F4（普通科 4部）</option>
                    <option value="J2">J2（情報科 2部）</option>
                    <option value="J4">J4（情報科 4部）</option>
                </select>
            </div>

            <div class="input-group">
                <label>現在の年次</label>
                <select id="grade">
                    <option value="1">1年次</option>
                    <option value="2">2年次</option>
                    <option value="3">3年次</option>
                    <option value="4">4年次</option>
                    <option value="5">5年次</option>
                    <option value="6">6年次</option>
                </select>
            </div>

            <button type="submit" class="btn-primary">登録してはじめる</button>
        </form>

        <p id="status"></p>

        <div class="link-text">
            すでにアカウントをお持ちの方は <a href="login.html">ログインはこちら</a>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/12.17.1/firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDcvsEO5LZGL6LlRul6GW0jZA6qCNb80n8",
            authDomain: "floormapapp-d63f3.fireba5seapp.com",
            projectId: "floormapapp-d63f3",
            storageBucket: "floormapapp-d63f3.firebasestorage.app",
            messagingSenderId: "215863510996",
            appId: "1:215863510996:web:09185c89e3428553d0b841"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const registerForm = document.getElementById("registerForm");
        const statusMsg = document.getElementById("status");

        // 独自のIDを裏でメールアドレス形式に変換する関数
        function convertIdToEmail(id) {
            return id.trim().toLowerCase() + "@yamabuki.local";
        }

        registerForm.addEventListener("submit", async (e) => {
            e.preventDefault();

            const inputId = document.getElementById("userId").value;
            const nickname = document.getElementById("nickname").value;
            const password = document.getElementById("password").value;
            const passwordConfirm = document.getElementById("passwordConfirm").value;
            const course = document.querySelector('input[name="course"]:checked').value;
            const classGroup = document.getElementById("classGroup").value;
            const grade = document.getElementById("grade").value;

            if (password !== passwordConfirm) {
                statusMsg.style.color = "#e11d48";
                statusMsg.innerText = "⚠️ パスワードが一致しません。";
                return;
            }

            const email = convertIdToEmail(inputId);
            statusMsg.style.color = "#475569";
            statusMsg.innerText = "アカウント作成中...";

            try {
                // 1. Firebase Authにアカウント作成（裏で [ID]@yamabuki.local として登録）
                // ※もしIDが既に使われている場合は、Firebaseが自動で「既に使われています」エラーを返します（重複制御クリア！）
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // 2. Firestoreの "users" コレクションに、山吹生の生徒情報を保存
                await setDoc(doc(db, "users", user.uid), {
                    loginId: inputId.trim(),
                    nickname: nickname,
                    course: course,
                    classGroup: classGroup,
                    grade: Number(grade),
                    createdAt: new Date()
                });

                statusMsg.style.color = "#16a34a";
                statusMsg.innerText = "🌟 登録成功！メインページへ移動します...";

                setTimeout(() => {
                    window.location.href = "mainpage.html";
                }, 1200);

            } catch (error) {
                statusMsg.style.color = "#e11d48";
                if (error.code === "auth/email-already-in-use") {
                    statusMsg.innerText = "❌ このログインIDは既に使われています。別のIDを指定してください。";
                } else if (error.code === "auth/weak-password") {
                    statusMsg.innerText = "❌ パスワードは6文字以上で入力してください。";
                } else {
                    statusMsg.innerText = "❌ エラー: " + error.message;
                }
            }
        });
    </script>
</body>
</html>
